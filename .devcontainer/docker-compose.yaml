services:
  server:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ..:/workspace
      - venv-data:/home/vscode/.venv
      - venv-cache:/home/vscode/.cache/uv
    working_dir: /workspace
    ports:
      - "8000:8000"
    tty: true

volumes:
  venv-data:
  venv-cache: